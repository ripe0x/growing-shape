[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
remappings = ["forge-std/=lib/forge-std/src/", "solady/=lib/solady/src/"]
fs_permissions = [{ access = "read-write", path = "./deployments" }, { access = "read", path = "./script" }]
# Fork tests read MAINNET_RPC_URL (default: Tenderly public gateway) and FORK_BLOCK (default pinned in
# test/fork/ForkBase.sol). A pinned block lets ~/.foundry/cache/rpc reuse fetched state.
no_storage_caching = false
gas_limit = "18446744073709551615"

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 64
fail_on_revert = false

[fmt]
line_length = 120

[lint]
lint_on_build = false
